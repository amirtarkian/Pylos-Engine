<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blokus Duo</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f1a; color: #e0e0e0;
    }

    .app { display: flex; height: 100vh; }

    .board-area {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1a 70%);
    }

    #board-canvas {
      cursor: pointer;
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 80px rgba(100,100,200,0.05);
    }

    .sidebar {
      width: 340px;
      background: linear-gradient(180deg, rgba(20,20,45,0.95) 0%, rgba(15,15,30,0.98) 100%);
      border-left: 1px solid rgba(255,255,255,0.06);
      padding: 24px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 18px;
    }

    .sidebar h2 {
      font-size: 20px; font-weight: 700; letter-spacing: 0.5px;
      background: linear-gradient(90deg, #e67e22, #9b59b6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .sidebar h3 { font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

    .status-bar {
      padding: 16px 20px; border-radius: 12px;
      text-align: center; font-size: 18px; font-weight: 700;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .status-bar.orange-turn {
      background: linear-gradient(135deg, rgba(230,126,34,0.12) 0%, rgba(230,126,34,0.06) 100%);
      border: 1.5px solid rgba(230,126,34,0.4);
      color: #e67e22;
      box-shadow: 0 0 24px rgba(230,126,34,0.08), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .status-bar.purple-turn {
      background: linear-gradient(135deg, rgba(155,89,182,0.12) 0%, rgba(155,89,182,0.06) 100%);
      border: 1.5px solid rgba(155,89,182,0.4);
      color: #9b59b6;
      box-shadow: 0 0 24px rgba(155,89,182,0.08), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .status-bar.game-over {
      background: linear-gradient(135deg, rgba(46,204,113,0.15) 0%, rgba(46,204,113,0.05) 100%);
      border: 1.5px solid rgba(46,204,113,0.5);
      color: #2ecc71;
      box-shadow: 0 0 30px rgba(46,204,113,0.1);
      font-size: 20px;
    }
    .status-bar.waiting {
      background: rgba(255,255,255,0.03); border: 1.5px solid rgba(255,255,255,0.08); color: #666;
    }
    .turn-dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; margin-right: 8px;
      vertical-align: middle; animation: pulse 2s ease-in-out infinite;
    }
    .turn-dot.orange { background: #e67e22; box-shadow: 0 0 8px rgba(230,126,34,0.5); }
    .turn-dot.purple { background: #9b59b6; box-shadow: 0 0 8px rgba(155,89,182,0.5); }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    select, button {
      font-family: inherit; font-size: 13px; padding: 8px 14px;
      background: rgba(255,255,255,0.06); color: #ccc;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
      cursor: pointer; transition: all 0.2s;
    }
    select:hover, button:hover { background: rgba(255,255,255,0.1); color: #fff; }
    button.primary {
      background: linear-gradient(135deg, rgba(46,204,113,0.2), rgba(46,204,113,0.1));
      border-color: rgba(46,204,113,0.3); color: #2ecc71; font-weight: 600;
    }
    button.primary:hover { background: linear-gradient(135deg, rgba(46,204,113,0.35), rgba(46,204,113,0.2)); }

    .controls { display: flex; flex-direction: column; gap: 10px; }
    .control-row { display: flex; gap: 8px; align-items: center; }
    .control-row label { font-size: 12px; color: #777; min-width: 80px; text-transform: uppercase; letter-spacing: 0.5px; }

    .scores { display: flex; gap: 12px; }
    .score-card {
      flex: 1; padding: 14px; border-radius: 10px;
      background: rgba(255,255,255,0.03); text-align: center;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .score-card .label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1.5px; }
    .score-card .value { font-size: 28px; font-weight: 800; margin-top: 4px; }
    .score-card.orange .value { color: #e67e22; }
    .score-card.purple .value { color: #9b59b6; }

    .piece-tray { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0; }
    .piece-btn {
      width: 50px; height: 50px; position: relative;
      background: rgba(255,255,255,0.04); border: 2px solid transparent;
      border-radius: 8px; cursor: pointer; padding: 3px;
      transition: all 0.15s;
    }
    .piece-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
    .piece-btn.selected {
      border-color: #2ecc71; background: rgba(46,204,113,0.12);
      box-shadow: 0 0 12px rgba(46,204,113,0.15);
    }
    .piece-btn.used { opacity: 0.15; pointer-events: none; filter: grayscale(1); }
    .piece-btn canvas { width: 100%; height: 100%; }

    .rotate-controls { display: flex; gap: 8px; margin: 4px 0; }
    .rotate-controls button { flex: 1; font-size: 12px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="board-area">
      <canvas id="board-canvas"></canvas>
    </div>
    <div class="sidebar">
      <h2>Blokus Duo</h2>
      <div class="status-bar waiting" id="status-bar">Click New Game to start</div>
      <div class="scores">
        <div class="score-card orange">
          <div class="label">Orange</div>
          <div class="value" id="orange-pieces">21</div>
        </div>
        <div class="score-card purple">
          <div class="label">Purple</div>
          <div class="value" id="purple-pieces">21</div>
        </div>
      </div>
      <div class="controls">
        <div class="control-row">
          <label>Mode</label>
          <select id="sel-mode">
            <option value="human_vs_human">Human vs Human</option>
            <option value="human_vs_ai">Human vs AI</option>
            <option value="ai_vs_ai">AI vs AI</option>
          </select>
        </div>
        <div class="control-row" id="group-color">
          <label>Play as</label>
          <select id="sel-color">
            <option value="white">Orange (first)</option>
            <option value="black">Purple (second)</option>
          </select>
        </div>
        <div class="control-row" id="group-search-iters">
          <label>AI Strength</label>
          <select id="sel-search-iters">
            <option value="16">16 iterations</option>
            <option value="32" selected>32 iterations</option>
            <option value="64">64 iterations</option>
            <option value="128">128 iterations</option>
          </select>
        </div>
        <button class="primary" id="btn-new-game">New Game</button>
      </div>
      <div id="piece-section" style="display:none;">
        <h3>Pieces <span id="orient-label" style="color:#2ecc71;"></span></h3>
        <div class="rotate-controls">
          <button id="btn-rotate">Rotate (R)</button>
          <button id="btn-flip">Flip (F)</button>
        </div>
        <div class="piece-tray" id="piece-tray"></div>
      </div>
    </div>
  </div>

<script>
const BOARD_SIZE = 14;
const CELL_SIZE = 40;
const BOARD_PAD = 32;
const GAP = 2;
const CANVAS_SIZE = BOARD_SIZE * CELL_SIZE + BOARD_PAD * 2;

const C = {
  boardBg: '#1e1e3a',
  cell: '#252550',
  cellStroke: '#2f2f5f',
  orange: '#e67e22',
  orangeHi: '#f0a050',
  orangeShadow: '#b35e10',
  purple: '#9b59b6',
  purpleHi: '#c080d8',
  purpleShadow: '#6a3580',
  hoverValid: 'rgba(46, 204, 113, 0.35)',
  hoverInvalid: 'rgba(231, 76, 60, 0.3)',
  startDot: 'rgba(255,255,255,0.12)',
  coord: '#555',
};

let board = null;
let legalMoves = [];
let currentTurn = null;
let gameOver = false;
let isMyTurn = false;
let gameActive = false;
let selectedPieceIdx = null;
let selectedOrientIdx = 0;
let hoveredCell = null;
let knownPieceOrients = {};
let lastPlacedCells = [];
let animProgress = 1;
let animTimer = null;

const canvas = document.getElementById('board-canvas');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_SIZE;
canvas.height = CANVAS_SIZE;

const statusBar = document.getElementById('status-bar');
const orangePiecesEl = document.getElementById('orange-pieces');
const purplePiecesEl = document.getElementById('purple-pieces');
const selMode = document.getElementById('sel-mode');
const selColor = document.getElementById('sel-color');
const selSearchIters = document.getElementById('sel-search-iters');
const btnNewGame = document.getElementById('btn-new-game');
const pieceTray = document.getElementById('piece-tray');
const pieceSection = document.getElementById('piece-section');
const btnRotate = document.getElementById('btn-rotate');
const btnFlip = document.getElementById('btn-flip');
const orientLabel = document.getElementById('orient-label');
const groupColor = document.getElementById('group-color');
const groupSearchIters = document.getElementById('group-search-iters');

let ws = null;
function wsConnect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/game`);
  ws.onopen = () => console.log('[ws] connected');
  ws.onmessage = (e) => { try { handleMessage(JSON.parse(e.data)); } catch(err) { console.error(err); } };
  ws.onclose = () => setTimeout(wsConnect, 2000);
}
function wsSend(msg) { if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg)); }

function extractPieceInfo(moves) {
  for (const m of moves) {
    if (!knownPieceOrients[m.piece_idx]) knownPieceOrients[m.piece_idx] = {};
    if (!knownPieceOrients[m.piece_idx][m.orientation]) {
      knownPieceOrients[m.piece_idx][m.orientation] = m.cells.map(c => ({row: c.row - m.row, col: c.col - m.col}));
    }
  }
}

function handleMessage(msg) {
  if (msg.type === 'state') {
    const oldBoard = board;
    board = msg.board;
    currentTurn = msg.turn;
    legalMoves = msg.legal_moves || [];
    gameOver = false;
    gameActive = true;
    if (legalMoves.length > 0) extractPieceInfo(legalMoves);
    orangePiecesEl.textContent = msg.pieces_remaining?.orange ?? '?';
    purplePiecesEl.textContent = msg.pieces_remaining?.purple ?? '?';

    // Find newly placed cells for animation
    if (oldBoard) {
      lastPlacedCells = [];
      for (let r = 0; r < BOARD_SIZE; r++)
        for (let c = 0; c < BOARD_SIZE; c++)
          if (board[r][c] && !oldBoard[r]?.[c]) lastPlacedCells.push({r, c});
      if (lastPlacedCells.length > 0) startPlaceAnim();
    }

    updateStatus();
    updatePieceTray();
    drawBoard();
  } else if (msg.type === 'ai_move') {
    statusBar.innerHTML = `<span class="turn-dot ${currentTurn}"></span>AI played ${msg.action?.piece || '?'} (${msg.thinking_time_ms}ms)`;
  } else if (msg.type === 'game_over') {
    gameOver = true; gameActive = false;
    const w = msg.winner;
    const name = w === 'draw' ? 'Draw' : (w === 'white' ? 'Orange' : 'Purple');
    statusBar.innerHTML = w === 'draw' ? 'Game Over — Draw!' : `Game Over — ${name} wins!`;
    statusBar.className = 'status-bar game-over';
    pieceSection.style.display = 'none';
    drawBoard();
  } else if (msg.type === 'error') {
    statusBar.textContent = `Error: ${msg.message}`;
  }
}

function startPlaceAnim() {
  animProgress = 0;
  if (animTimer) cancelAnimationFrame(animTimer);
  const start = performance.now();
  function tick(now) {
    animProgress = Math.min(1, (now - start) / 300);
    drawBoard();
    if (animProgress < 1) animTimer = requestAnimationFrame(tick);
    else animTimer = null;
  }
  animTimer = requestAnimationFrame(tick);
}

function updateStatus() {
  if (gameOver) return;
  const mode = selMode.value;
  const turnName = currentTurn === 'orange' ? 'Orange' : 'Purple';
  const dot = `<span class="turn-dot ${currentTurn}"></span>`;
  if (mode === 'human_vs_ai') {
    const ht = currentTurn === (selColor.value === 'white' ? 'orange' : 'purple');
    statusBar.innerHTML = ht ? `${dot}Your turn (${turnName})` : `${dot}AI thinking...`;
    isMyTurn = ht;
  } else if (mode === 'ai_vs_ai') {
    statusBar.innerHTML = `${dot}${turnName}'s turn (AI)`; isMyTurn = false;
  } else {
    statusBar.innerHTML = `${dot}${turnName}'s turn`; isMyTurn = true;
  }
  statusBar.className = `status-bar ${currentTurn}-turn`;
  pieceSection.style.display = (isMyTurn && legalMoves.length > 0) ? 'block' : 'none';
}

function updatePieceTray() {
  pieceTray.innerHTML = '';
  if (!isMyTurn || !legalMoves.length) return;
  const avail = new Set(legalMoves.map(m => m.piece_idx));
  for (let pi = 0; pi < 21; pi++) {
    const btn = document.createElement('div');
    btn.className = 'piece-btn' + (!avail.has(pi) ? ' used' : '') + (pi === selectedPieceIdx ? ' selected' : '');
    const mc = document.createElement('canvas');
    mc.width = 44; mc.height = 44;
    drawMiniPiece(mc.getContext('2d'), pi, 44);
    btn.appendChild(mc);
    btn.onclick = () => { if (!avail.has(pi)) return; selectedPieceIdx = pi; selectedOrientIdx = 0; updatePieceTray(); drawBoard(); };
    pieceTray.appendChild(btn);
  }
  if (selectedPieceIdx !== null && knownPieceOrients[selectedPieceIdx]) {
    const n = Object.keys(knownPieceOrients[selectedPieceIdx]).length;
    orientLabel.textContent = `(${selectedOrientIdx + 1}/${n})`;
  } else orientLabel.textContent = '';
}

function drawMiniPiece(mctx, pi, sz) {
  const o = knownPieceOrients[pi]; if (!o) return;
  const cells = o[Object.keys(o)[0]]; if (!cells) return;
  const maxR = Math.max(...cells.map(c=>c.row))+1, maxC = Math.max(...cells.map(c=>c.col))+1;
  const cs = Math.min(sz / Math.max(maxR, maxC, 3), 11);
  const ox = (sz - maxC*cs)/2, oy = (sz - maxR*cs)/2;
  const base = currentTurn === 'orange' ? C.orange : C.purple;
  const hi = currentTurn === 'orange' ? C.orangeHi : C.purpleHi;
  for (const c of cells) {
    const x = ox + c.col*cs, y = oy + c.row*cs, s = cs - 1;
    mctx.fillStyle = base;
    mctx.fillRect(x, y, s, s);
    mctx.fillStyle = hi;
    mctx.fillRect(x, y, s, 2);
    mctx.fillRect(x, y, 2, s);
  }
}

// ── Board drawing ──────────────────────────────────────────────────
function drawBoard() {
  // Background with subtle vignette
  ctx.fillStyle = C.boardBg;
  ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  const vg = ctx.createRadialGradient(CANVAS_SIZE/2, CANVAS_SIZE/2, CANVAS_SIZE*0.3, CANVAS_SIZE/2, CANVAS_SIZE/2, CANVAS_SIZE*0.7);
  vg.addColorStop(0, 'rgba(255,255,255,0.02)');
  vg.addColorStop(1, 'rgba(0,0,0,0.15)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

  const isNewCell = new Set(lastPlacedCells.map(c => `${c.r},${c.c}`));

  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      const x = BOARD_PAD + c * CELL_SIZE + GAP/2;
      const y = BOARD_PAD + r * CELL_SIZE + GAP/2;
      const s = CELL_SIZE - GAP;

      // Cell base
      ctx.fillStyle = C.cell;
      ctx.beginPath();
      roundRect(ctx, x, y, s, s, 3);
      ctx.fill();

      // Start position markers
      if ((r===4&&c===4)||(r===9&&c===9)) {
        ctx.fillStyle = C.startDot;
        ctx.beginPath();
        roundRect(ctx, x+3, y+3, s-6, s-6, 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.beginPath();
        ctx.arc(x+s/2, y+s/2, 4, 0, Math.PI*2);
        ctx.fill();
      }

      // Placed pieces with 3D bevel effect
      const val = board ? board[r]?.[c] : null;
      if (val) {
        const isOrange = val === 'orange';
        const base = isOrange ? C.orange : C.purple;
        const hi = isOrange ? C.orangeHi : C.purpleHi;
        const shadow = isOrange ? C.orangeShadow : C.purpleShadow;

        let scale = 1;
        if (isNewCell.has(`${r},${c}`) && animProgress < 1) {
          scale = 0.3 + 0.7 * easeOutBack(animProgress);
        }

        const cx = x + s/2, cy = y + s/2;
        const ts = s * scale;
        const tx = cx - ts/2, ty = cy - ts/2;

        // Drop shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        roundRect(ctx, tx+2, ty+2, ts, ts, 4);
        ctx.fill();

        // Main tile
        ctx.fillStyle = base;
        ctx.beginPath();
        roundRect(ctx, tx, ty, ts, ts, 4);
        ctx.fill();

        // Top highlight bevel
        ctx.fillStyle = hi;
        ctx.beginPath();
        roundRect(ctx, tx, ty, ts, 4, 4);
        ctx.fill();

        // Left highlight bevel
        ctx.fillStyle = hi + '80';
        ctx.fillRect(tx, ty+4, 3, ts-8);

        // Bottom shadow bevel
        ctx.fillStyle = shadow;
        ctx.beginPath();
        roundRect(ctx, tx, ty+ts-4, ts, 4, 0);
        ctx.fill();

        // Inner shine
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.beginPath();
        roundRect(ctx, tx+4, ty+4, ts-8, ts/2-4, 2);
        ctx.fill();
      }
    }
  }

  // Hover preview
  if (isMyTurn && selectedPieceIdx !== null && hoveredCell && !gameOver) {
    const cells = getSelectedPieceCells(hoveredCell.row, hoveredCell.col);
    if (cells) {
      const valid = findMatchingAction(selectedPieceIdx, selectedOrientIdx, hoveredCell.row, hoveredCell.col) !== null;
      for (const cell of cells) {
        if (cell.row >= 0 && cell.row < BOARD_SIZE && cell.col >= 0 && cell.col < BOARD_SIZE) {
          const x = BOARD_PAD + cell.col * CELL_SIZE + GAP/2;
          const y = BOARD_PAD + cell.row * CELL_SIZE + GAP/2;
          const s = CELL_SIZE - GAP;
          ctx.fillStyle = valid ? C.hoverValid : C.hoverInvalid;
          ctx.beginPath();
          roundRect(ctx, x, y, s, s, 3);
          ctx.fill();
          if (valid) {
            ctx.strokeStyle = 'rgba(46,204,113,0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            roundRect(ctx, x, y, s, s, 3);
            ctx.stroke();
          }
        }
      }
    }
  }

  // Coordinates
  ctx.fillStyle = C.coord;
  ctx.font = '11px system-ui';
  ctx.textAlign = 'center';
  for (let c = 0; c < BOARD_SIZE; c++)
    ctx.fillText(c, BOARD_PAD + c*CELL_SIZE + CELL_SIZE/2, BOARD_PAD - 10);
  ctx.textAlign = 'right';
  for (let r = 0; r < BOARD_SIZE; r++)
    ctx.fillText(r, BOARD_PAD - 10, BOARD_PAD + r*CELL_SIZE + CELL_SIZE/2 + 4);
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function getSelectedPieceCells(row, col) {
  if (selectedPieceIdx === null) return null;
  const o = knownPieceOrients[selectedPieceIdx]; if (!o) return null;
  const keys = Object.keys(o).map(Number).sort((a,b)=>a-b);
  const oi = keys[selectedOrientIdx % keys.length];
  const cells = o[oi]; if (!cells) return null;
  return cells.map(c => ({row: row+c.row, col: col+c.col}));
}

function findMatchingAction(pi, oi, row, col) {
  const keys = Object.keys(knownPieceOrients[pi]||{}).map(Number).sort((a,b)=>a-b);
  const orient = keys[oi % keys.length];
  for (const m of legalMoves)
    if (m.piece_idx === pi && m.orientation === orient && m.row === row && m.col === col) return m.action;
  return null;
}

// ── Input ──────────────────────────────────────────────────────────
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);
  const col = Math.floor((mx - BOARD_PAD) / CELL_SIZE);
  const row = Math.floor((my - BOARD_PAD) / CELL_SIZE);
  hoveredCell = (row>=0 && row<BOARD_SIZE && col>=0 && col<BOARD_SIZE) ? {row,col} : null;
  drawBoard();
});
canvas.addEventListener('mouseleave', () => { hoveredCell = null; drawBoard(); });

canvas.addEventListener('click', () => {
  if (!isMyTurn || gameOver || !hoveredCell || selectedPieceIdx === null) return;
  const action = findMatchingAction(selectedPieceIdx, selectedOrientIdx, hoveredCell.row, hoveredCell.col);
  if (action !== null) {
    wsSend({type: 'move', action: {action}});
    selectedPieceIdx = null; selectedOrientIdx = 0; hoveredCell = null;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key==='r'||e.key==='R') rotPiece();
  else if (e.key==='f'||e.key==='F') flipPiece();
});

function rotPiece() {
  if (selectedPieceIdx===null) return;
  const k = Object.keys(knownPieceOrients[selectedPieceIdx]||{}); if (!k.length) return;
  selectedOrientIdx = (selectedOrientIdx+1) % k.length;
  orientLabel.textContent = `(${selectedOrientIdx+1}/${k.length})`; drawBoard();
}
function flipPiece() {
  if (selectedPieceIdx===null) return;
  const k = Object.keys(knownPieceOrients[selectedPieceIdx]||{}); if (k.length<=1) return;
  selectedOrientIdx = (selectedOrientIdx + Math.floor(k.length/2)) % k.length;
  orientLabel.textContent = `(${selectedOrientIdx+1}/${k.length})`; drawBoard();
}

btnRotate.addEventListener('click', rotPiece);
btnFlip.addEventListener('click', flipPiece);

selMode.addEventListener('change', () => {
  groupColor.style.display = selMode.value === 'human_vs_ai' ? 'flex' : 'none';
  groupSearchIters.style.display = selMode.value === 'human_vs_human' ? 'none' : 'flex';
});
selMode.dispatchEvent(new Event('change'));

btnNewGame.addEventListener('click', () => {
  const mode = selMode.value;
  const msg = {type: 'new_game', mode};
  if (mode === 'human_vs_ai') { msg.human_color = selColor.value; msg.search_iterations = +selSearchIters.value; }
  else if (mode === 'ai_vs_ai') { msg.search_iterations = +selSearchIters.value; msg.delay_ms = 1000; }
  selectedPieceIdx = null; selectedOrientIdx = 0; knownPieceOrients = {}; lastPlacedCells = [];
  wsSend(msg);
});

drawBoard();
wsConnect();
</script>
</body>
</html>
